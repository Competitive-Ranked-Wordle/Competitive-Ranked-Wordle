name: Docker Image CI

on:
  push:
    branches: ["master"]
  schedule:
    # Nightly build of the dev branch at 05:00 UTC
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Determine build ref and tags
        id: config
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "ref=dev" >> $GITHUB_OUTPUT
            echo "tags=jivandabeast/competitive-ranked-wordle:dev" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ github.ref }}" >> $GITHUB_OUTPUT
            printf 'tags<<EOF\njivandabeast/competitive-ranked-wordle:latest\njivandabeast/competitive-ranked-wordle:${{ github.sha }}\nEOF\n' >> $GITHUB_OUTPUT
          fi

      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.config.outputs.ref }}
          fetch-depth: 0

      - name: Check for recent changes on dev (nightly only)
        if: github.event_name == 'schedule'
        id: changes
        run: |
          # Only build if there has been a new commit on dev in the last 24 hours
          if [ -n "$(git log --since='24 hours ago' -n 1 --pretty=format:'%H')" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "No changes on dev in the last 24 hours; skipping build."
          fi

      - name: Set up QEMU
        if: github.event_name != 'schedule' || steps.changes.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: github.event_name != 'schedule' || steps.changes.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: github.event_name != 'schedule' || steps.changes.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push to DockerHub
        if: github.event_name != 'schedule' || steps.changes.outputs.should_build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.config.outputs.tags }}
